name: Actualizar asistencia

on:
  schedule:
    # Lunes 14:00 UTC. Ajustar a la hora local en que ya esté subido el export.
    - cron: '0 14 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-asistencia
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Leer Drive y calcular
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BIOMETRICO_FOLDER_ID: ${{ vars.BIOMETRICO_FOLDER_ID }}
          HORARIOS_FUENTE: ${{ vars.HORARIOS_FUENTE || 'manual' }}
          HORARIOS_SHEET_ID: ${{ vars.HORARIOS_SHEET_ID }}
        run: npm run build

      - name: Publicar datos
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos de asistencia $(date -u +%Y-%m-%d)"
            git push
          fi
